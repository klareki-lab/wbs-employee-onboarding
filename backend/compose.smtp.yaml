# Employee Onboarding only. Use AFTER compose.yaml and compose.n8n.yaml.
# Pass --env-file backend/.env --env-file backend/.env.smtp (secrets ignored by Git).
services:
  api:
    environment:
      SMTP_MODE: external
      SMTP_HOST: ${SMTP_HOST:?Set the independently authorized SMTP host in backend/.env.smtp}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set the dedicated SMTP username in backend/.env.smtp}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set the dedicated SMTP password in backend/.env.smtp}
      SMTP_FROM: ${SMTP_FROM:?Set the authorized onboarding sender in backend/.env.smtp}
