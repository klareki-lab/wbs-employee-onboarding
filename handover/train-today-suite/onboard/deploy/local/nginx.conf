server {
    listen 8080;
    server_name localhost;
    # Activation validation uses a token query: never retain request URIs.
    access_log off;
    error_log /dev/null;
    root /usr/share/nginx/html;
    # Resolve again after API container recreation; keep browser requests same-origin.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/ {
        set $backend http://api:3001;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /coordinator/ {
        set $coordinator http://onboarding-dashboard:3010;
        rewrite ^/coordinator/(.*)$ /api/$1 break;
        proxy_pass $coordinator$uri$is_args$args;
        proxy_set_header Host localhost:3010;
    }
    location / { try_files $uri $uri/ /index.html; }
}
