# Local-only overlay. Reuses only the onboarding project's private Docker network.
services:
  n8n:
    image: n8nio/n8n:2.41.7
    ports:
      - "127.0.0.1:5681:5678"
    env_file:
      - ../workflows/.local/n8n.env
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5681
      N8N_WEBHOOK_URL: http://localhost:5681/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      GENERIC_TIMEZONE: Europe/Berlin
    volumes:
      - onboarding_n8n:/home/node/.n8n
    depends_on:
      api:
        condition: service_started
volumes:
  onboarding_n8n:
