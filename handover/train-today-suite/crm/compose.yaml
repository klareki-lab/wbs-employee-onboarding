name: train-today-crm
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Run setup first}
      POSTGRES_DB: crm
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - crm_database:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 3s
      timeout: 3s
      retries: 25
    restart: unless-stopped
  n8n-crm:
    image: n8nio/n8n:2.40.7-09b3ce6-pc
    profiles: [local-core]
    ports: ["127.0.0.1:5682:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_MODE: internal
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Berlin
    volumes: ["crm_n8n:/home/node/.n8n"]
    restart: unless-stopped
  mock-providers:
    image: node:22-alpine
    profiles: [local-core]
    working_dir: /app
    command: ["node", "tests/mock-providers.mjs"]
    volumes: ["./tests:/app/tests:ro"]
    restart: unless-stopped
  app:
    build: .
    ports: ["127.0.0.1:3080:3080"]
    environment:
      LEADERSHIP_BRIDGE_KEY: ${LEADERSHIP_BRIDGE_KEY:-}
      LEADERSHIP_CRM_LOGIN: leitung
      LEADERSHIP_AI_KEY: ${LEADERSHIP_AI_KEY:-}
      LEADERSHIP_AI_BASE_URL: ${LEADERSHIP_AI_BASE_URL:-https://api.openai.com/v1}
      LEADERSHIP_AI_MODEL: ${LEADERSHIP_AI_MODEL:-gpt-4o-mini}
      PORT: 3080
      DATABASE_URL: postgres://crm_app:${DB_APP_PASSWORD}@db:5432/crm
      AGENT_DATABASE_URL: postgres://crm_agent:${DB_AGENT_PASSWORD}@db:5432/crm
      INTERNAL_KEY: ${INTERNAL_KEY}
      PUBLIC_ORIGIN: http://localhost:3080
      CORE_BASE_URL: ${CORE_BASE_URL:-}
      CORE_KEY: ${CORE_KEY:-}
      CORE_MODE: ${CORE_MODE:-disconnected}
      AI_BASE_URL: ${AI_BASE_URL:-https://router.requesty.ai/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-4.1-mini}
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  crm_database:
  crm_n8n:
